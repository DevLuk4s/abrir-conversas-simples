<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Abrir Conversas</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 720px;
    margin: 20px auto;
    padding: 0 16px;
    background: #f5f5f5;
    color: #222;
  }
  h1 { font-size: 22px; }
  .upload-area {
    display: block;
    border: 2px dashed #999;
    border-radius: 10px;
    padding: 24px;
    text-align: center;
    background: #fff;
    margin-bottom: 20px;
    min-height: 60px;
  }
  .upload-area.arrastando { border-color: #25D366; background: #eafff1; }
  .upload-area input[type="file"] {
    display: block;
    margin: 10px auto 0;
  }
  .contador { margin: 12px 0; color: #555; font-size: 14px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
  tr.aberto { background: #eafff1; }
  tr.enviada { background: #e6f0ff; }
  tr.nao-encontrado { background: #f5f5f5; color: #999; text-decoration: line-through; }
  button {
    background: #25D366;
    color: #fff;
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    margin: 2px 0;
  }
  button:disabled { background: #bbb; cursor: default; }
  button.enviar { background: #3b82f6; }
  button.nao-encontrado { background: #888; }
  .limpar { background: #999; float: right; margin-bottom: 10px; }
  .exportar { background: #555; float: right; margin: 0 8px 10px 0; }
  .vazio { text-align: center; color: #888; padding: 30px; }
  .aviso {
    background: #fff8e1;
    border: 1px solid #ffe082;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    margin-bottom: 16px;
  }
  @media (max-width: 600px) {
    table, thead, tbody, th, td, tr { display: block; }
    thead { display: none; }
    tr { margin-bottom: 12px; border-radius: 8px; overflow: hidden; border: 1px solid #eee; }
    td { border-bottom: none; }
  }
</style>
</head>
<body>

<h1>Abrir Conversas no WhatsApp</h1>

<div class="aviso">
  Os dados ficam salvos só neste navegador/aparelho. Não sincronizam entre notebook e celular.
</div>

<label style="font-size: 13px; color: #555; display: block; margin-bottom: 4px;">
  Modelo de mensagem (use {NOME} onde quiser o nome do negócio)
</label>
<textarea id="modeloMensagem" rows="3" style="width: 100%; box-sizing: border-box; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-family: inherit; font-size: 14px; margin-bottom: 20px;" placeholder="Oi! Vi que a {NOME} não tem site próprio ainda..."></textarea>

<div class="upload-area" id="areaUpload">
  <div id="textoUpload">Escolha o CSV de leads (nome,telefone) ou arraste aqui</div>
  <input type="file" id="inputCsv" accept=".csv" />
</div>

<div class="upload-area" id="areaImportar" style="padding: 14px; margin-bottom: 20px;">
  <div id="textoImportar" style="font-size: 13px; color: #666;">Importar backup de outro painel (arquivo .json)</div>
  <input type="file" id="inputImportar" accept=".json" />
</div>

<button class="limpar" onclick="limparLista()">Limpar lista</button>
<button class="exportar" onclick="exportarBackup()">Exportar backup</button>
<div class="contador" id="contador"></div>

<table id="tabela" style="display:none">
  <thead>
    <tr><th>Nome</th><th>Telefone</th><th>Ação</th></tr>
  </thead>
  <tbody id="corpoTabela"></tbody>
</table>

<div class="vazio" id="vazio">Nenhum lead carregado ainda.</div>

<script src="app.js"></script>
</body>
</html>
